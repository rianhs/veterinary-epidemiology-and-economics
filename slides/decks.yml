- title: Explain epidemiology
  type: slides
  path: /slides/explain-epidemiology.html
  description: Explain the definition of epidemiology and tell clinical questions from population questions.
  categories: [C1, S1.1]
- title: Set an objective from the disease status of a population
  type: slides
  path: /slides/set-objective-from-disease-status.html
  description: "Read the disease status of a population and set the objective that follows: find out the status, keep the disease out, or reduce it."
  categories: [C1, S1.2]
- title: Explain veterinary economics
  type: slides
  path: /slides/explain-veterinary-economics.html
  description: Explain scarcity, opportunity cost, the value of animal health, and private and public benefits.
  categories: [C1, S1.3]
- title: Identify levels of analysis
  type: slides
  path: /slides/identify-levels-of-analysis.html
  description: Identify the level of a statement or a problem (individual animal, animal population, or animal product chain and system), and keep a conclusion at the level of its data.
  categories: [C1, S1.4]
- title: Explain epidemiological approaches and questions
  type: slides
  path: /slides/explain-epidemiological-approaches-and-questions.html
  description: Explain which approach of epidemiology answers each of the five questions, and place a problem in the five questions and the population-to-intervention loop.
  categories: [C1, S1.5]
- title: Frame a problem as an answerable question
  type: slides
  path: /slides/frame-problem-as-answerable-question.html
  description: "Check whether a question is clear, can be answered with evidence, belongs to epidemiology or economics, and serves a choice, then list the information that it needs, with a source for each item."
  categories: [C1, S1.6]
- title: Identify the epidemiological unit
  type: slides
  path: /slides/identify-the-epidemiological-unit.html
  description: Find the group of animals that have about the same chance of exposure to a hazard, and tell the epidemiological unit from the units of observation and analysis.
  categories: [C2, S2.1]
