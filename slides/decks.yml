- title: Explain epidemiology
  type: slides
  path: /slides/explain-epidemiology.html
  description: Explain the definition of epidemiology and tell clinical questions from population questions.
  categories: [C1, S1.1, S1.2]
- title: Explain veterinary economics
  type: slides
  path: /slides/explain-veterinary-economics.html
  description: Explain scarcity, opportunity cost, the value of animal health, and private and public benefits.
  categories: [C1, S1.4]
- title: Link approaches to domains
  type: slides
  path: /slides/link-approaches-to-domains.html
  description: Link each approach of epidemiology to a domain and place a problem in the five questions and the information-to-action loop.
  categories: [C1, S1.6, S1.7]
- title: Match the disease status of a population to an objective
  type: slides
  path: /slides/match-population-status-to-objective.html
  description: Match the population status of a disease to the objective of reducing the problem or keeping it out.
  categories: [C1, S1.3]
- title: Identify levels of analysis
  type: slides
  path: /slides/identify-levels-of-analysis.html
  description: Identify the level of a statement or a problem (individual animal, animal population, or animal product chain and system), and keep a conclusion at the level of its data.
  categories: [C1, S1.5]
- title: Write a problem frame
  type: slides
  path: /slides/write-problem-frame.html
  description: "Write a problem frame with five parts: population, outcome, decision, decision maker, and objective."
  categories: [C1, S1.8]
- title: List the information that a decision needs
  type: slides
  path: /slides/list-information-for-decision.html
  description: "List the items of information that a decision needs, each with a possible source."
  categories: [C1, S1.9]
